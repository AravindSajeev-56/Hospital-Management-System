{%load static%}
<!DOCTYPE html>
<head>
<title>reset password</title>
<style>
ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color:lightblue;
}

li {
  float: left;

}

li a {
  display: block;
  color:black;
  text-align: left;
  padding: 16px 16px;
  text-decoration:none;
}
.active{
    text-decoration: whitesmoke;
}
input[type=text], select {
  width: 100%;
  padding: 12px 20px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
}
input[id=password], select {
  width: 100%;
  padding: 12px 20px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  border-radius: 4px;
  box-sizing: border-box;
}

input[type=submit] {
  width: 100%;
  background-color: #4CAF50;
  color: white;
  padding: 14px 20px;
  margin: 8px 0;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

input[type=submit]:hover {
  background-color: #45a049;
}

div {
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px;
}
</style>
</head>
<body>
    <ul>
        <h1 style="text-align: center; color: red;">AS Hospital 🏥</h1>

    </ul>

<h1 style="text-align: center; color: brown;">Reset Your Password</h1>
<div>
    <form method="POST" action="passwordreset">
        {% csrf_token %}
      <label for="fname">User Name</label>
      <input type="text" id="uname" name="uname" placeholder="hari..">
  
      <label for="lname">Email</label>
      <input type="text" id="email" name="email" placeholder="abc@gmail.com..">
      
      <label for="lname">New Password</label>
      <input type="password" id="password" name="password" placeholder="*********..">
    
      <input type="submit" value="Submit">
    </form>
  </div>
    <br>
{{errmsg}}
    <br>
    <br>
</body>
</html>
