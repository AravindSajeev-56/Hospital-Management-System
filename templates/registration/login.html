{%load static%}
<!DOCTYPE html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>login</title>
<style>
ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color:lightblue;
}

li {
  float: left;

}

li a {
  display: block;
  color:black;
  text-align: left;
  padding: 16px 16px;
  text-decoration:none;
}
.active{
    text-decoration: whitesmoke;
}
body {font-family: Arial, Helvetica, sans-serif;}
form {border: 3px solid #f1f1f1;}

input[type=text], input[type=password] {
  width: 100%;
  padding: 12px 20px;
  margin: 8px 0;
  display: inline-block;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

button {
  background-color: #04AA6D;
  color: white;
  padding: 14px 20px;
  margin: 8px 0;
  border: none;
  cursor: pointer;
  width: 100%;
}

button:hover {
  opacity: 0.8;
}


.container {
  padding: 16px;
}

span.psw {
  float: right;
  padding-top: 16px;
}
</style>
</head>
<body>
    <ul>
        <h1 style="text-align: center; color: red;">AS Hospital 🏥</h1>
        <li><a class="active" href="{% url 'home'%}">Home</a></li>
        <li><a href="{% url 'aidoctor'%}">AI Doctor</a></li>
        <li><a href="{% url 'department'%}">Departments</a></li>
        <li><a href="{% url 'doctors'%}">Doctors</a></li>
        <li><a href="{% url 'ourhospital'%}">Our Hospital</a></li>
        <li><a href="{% url 'about'%}">About</a></li> <br><br>
    </ul>
<div>
    <img src="{%static '/image5.webp'%}" alt="hospital..." width="1500" height="500">
</div>
<h1 style="text-align: center; color: brown;">Login to access more exclusive features</h1>
<form action="userlogin" method="post">
  {%csrf_token%}
  <div class="container">
    <label for="uname"><b>Username</b></label>
    <input type="text" placeholder="Enter Username" name="username" required>

    <label for="psw"><b>Password</b></label>
    <input type="password" placeholder="Enter Password" name="password" required>
        
    <button type="submit">Login</button>
  </div>

  <div class="container" style="background-color:#f1f1f1">
    <a href="{% url 'signup'%}">Create Acccount</a><br><br>
    <a href="{% url 'passwordreset'%}">Forgot Password</a>
    </div>
</form>

</html>
