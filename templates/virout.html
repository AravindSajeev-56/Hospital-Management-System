{%load static%}
<!DOCTYPE html>
<head>
<title>booking</title>
<style>
ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color:lightblue;
}

li {
  float: left;

}

li a {
  display: block;
  color:black;
  text-align: left;
  padding: 16px 16px;
  text-decoration:none;
}
.active{
    text-decoration: whitesmoke;
}
.button {
  background-color: red; /* Green */
  border: none;
  color: white;
  padding: 15px 32px;
  text-align: center;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  margin: 4px 2px;
  cursor: pointer;
  -webkit-transition-duration: 0.4s; /* Safari */
  transition-duration: 0.4s;
}

.button2:hover {
  box-shadow: 0 12px 16px 0 rgba(0,0,0,0.24),0 17px 50px 0 rgba(0,0,0,0.19);
}
</style>
</head>
<body>
    <ul>
        <h2 style="text-align: center; color: red;">AS Hospital 🏥</h2>
        <li><a class="active" href="{% url 'home'%}">Home</a></li>
        <li><a href="{% url 'booking'%}">Booking</a></li>
        <li><a href="{% url 'virtualdoctor'%}">Virtual Doctors</a></li>
        <li><a href="{% url 'aidoctor'%}">AI Doctor</a></li>
        <li><a href="{% url 'department'%}">Departments</a></li>
        <li><a href="{% url 'doctors'%}">Doctors</a></li>
        <li><a href="{% url 'ourhospital'%}">Our Hospital</a></li>
        <li><a href="{% url 'about'%}">About</a></li> <br><br>
    </ul>

<h1 style="text-align: center; color: brown;">Virtual Doctor</h1>
<p style="padding: 2%;"><b> Please check your details before payment</b></p>

<div>
    <form method="post" action="payment" style="margin:2%;"> 
        {% csrf_token %} 
      <label>Name : {{output1}}</label><br><br>
      
      <label>Age : {{output2}}</label><br><br>
      
      <label>Phone Number : {{output3}}</label><br><br>
      
      <label>Email : {{output4}}</label><br><br>

      <label>Department : {{output5}}</label><br><br>

      <label>Amount : RS 500</label><br><br>

      <button class="button button2">Payment</button>

    </form>
</div>
<br>
<br>
<br>
</body>
</html>
