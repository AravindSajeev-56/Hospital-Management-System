{%load static%}
<!DOCTYPE html>
<head>
<title>payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
ul {
  list-style-type: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background-color:lightblue;
}

li {
  float: left;

}

li a {
  display: block;
  color:black;
  text-align: left;
  padding: 16px 16px;
  text-decoration:none;
}
.active{
    text-decoration: whitesmoke;
}
body {
  font-family: Arial;
  font-size: 17px;
  padding: 8px;
}

* {
  box-sizing: border-box;
}

.row {
  display: -ms-flexbox; /* IE10 */
  display: flex;
  -ms-flex-wrap: wrap; /* IE10 */
  flex-wrap: wrap;
  margin: 0 -16px;
}

.col-25 {
  -ms-flex: 25%; /* IE10 */
  flex: 25%;
}

.col-50 {
  -ms-flex: 50%; /* IE10 */
  flex: 50%;
}

.col-75 {
  -ms-flex: 75%; /* IE10 */
  flex: 75%;
}

.col-25,
.col-50,
.col-75 {
  padding: 0 16px;
}

.container {
  background-color: #f2f2f2;
  padding: 5px 20px 15px 20px;
  border: 1px solid lightgrey;
  border-radius: 3px;
}

input[type=text] {
  width: 100%;
  margin-bottom: 20px;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 3px;
}

label {
  margin-bottom: 10px;
  display: block;
}

.icon-container {
  margin-bottom: 20px;
  padding: 7px 0;
  font-size: 24px;
}

.btn {
  background-color: #04AA6D;
  color: white;
  padding: 12px;
  margin: 10px 0;
  border: none;
  width: 100%;
  border-radius: 3px;
  cursor: pointer;
  font-size: 17px;
}

.btn:hover {
  background-color: #45a049;
}

a {
  color: #2196F3;
}

hr {
  border: 1px solid lightgrey;
}

span.price {
  float: right;
  color: grey;
}

@media (max-width: 800px) {
  .row {
    flex-direction: column-reverse;
  }
  .col-25 {
    margin-bottom: 20px;
  }
}
</style>
</head>
<body>
    <ul>
        <h2 style="text-align: center; color: red;">AS Hospital 🏥</h2>
        <li><a class="active" href="{% url 'home'%}">Home</a></li>
        <li><a href="{% url 'booking'%}">Booking</a></li>
        <li><a href="{% url 'virtualdoctor'%}">Virtual Doctors</a></li>
        <li><a href="{% url 'aidoctor'%}">AI Doctor</a></li>
        <li><a href="{% url 'department'%}">Departments</a></li>
        <li><a href="{% url 'doctors'%}">Doctors</a></li>
        <li><a href="{% url 'ourhospital'%}">Our Hospital</a></li>
        <li><a href="{% url 'about'%}">About</a></li> <br><br>
    </ul><br>
    <div class="row">
        <div class="col-75">
          <div class="container">
            <form method="post" action="payment" style="margin:2%;"> 
                {% csrf_token %} 
      
                <div class="col-50">
                  <h3>Payment</h3>
                  <label for="fname">Accepted Cards</label>
                  <div class="icon-container">
                    <i class="fa fa-cc-visa" style="color:navy;"></i>
                    <i class="fa fa-cc-amex" style="color:blue;"></i>
                    <i class="fa fa-cc-mastercard" style="color:red;"></i>
                    <i class="fa fa-cc-discover" style="color:orange;"></i>
                  </div>
                  <label>Name on Card</label>
                  <input type="text" id="name" name="name" placeholder="hari">
                  <label>Credit card number</label>
                  <input type="text" id="cardnumber" name="cardnumber" placeholder="1111-2222-3333-4444">
                  <label>Exp Month</label>
                  <input type="text" id="expmonth" name="expmonth" placeholder="September">
                  <div class="row">
                    <div class="col-50">
                      <label>Exp Year</label>
                      <input type="text" id="expyear" name="expyear" placeholder="2018">
                    </div>
                    <div class="col-50">
                      <label for="cvv">CVV</label>
                      <input type="text" id="cvv" name="cvv" placeholder="352">
                    </div>
                  </div>
                </div>
                
              </div>
      
              <input type="submit" value="Continue to checkout" class="btn">
            </form>
          </div>
        </div>
    </div>
</div>
    <br>
    <br>
    <h1 style="text-align: center; color: brown;">Update</h1><br>
    <h3>Status : {{msg1}} </h3>
    <h3>Message :{{msg2}} </h3>
    <br>
</body>
</html>
